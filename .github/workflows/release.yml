name: Release

# Automatic releases: whenever the version in Cargo.toml changes on master
# (i.e. a version-bump PR is merged), this workflow tags vX.Y.Z, creates a
# GitHub release with the matching CHANGELOG section, and publishes the
# crate to crates.io. The tag/GitHub-release and the crates.io publish are
# gated independently, so a partially failed run (e.g. tag created but
# publish failed) is completed by simply re-running — each half is a no-op
# once its artifact exists. Changes to this workflow file also trigger a
# run, which self-heals any half-released version.
#
# crates.io authentication, in order of preference:
#  1. Trusted Publishing (OIDC) — no stored secret, tokens are minted
#     per-run. One-time setup on crates.io: crate Settings -> Trusted
#     Publishing -> GitHub (repository Liohtml/RUSTScrapling, workflow
#     release.yml). This is configured for rust_scrapling.
#  2. Fallback: the CARGO_REGISTRY_TOKEN repository secret, if set.
# With neither available, the tag + GitHub release still happen and
# publishing is skipped with a notice.

on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # OIDC token for crates.io trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so existing tags are visible

      - name: Determine version and what still needs releasing
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists — skipping tag + GitHub release."
            echo "tag_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_new=true" >> "$GITHUB_OUTPUT"
          fi
          # A 404 from the sparse index (crate or version unknown) means
          # "not published yet" — curl -f fails and the branch below runs.
          if curl -fsS "https://index.crates.io/ru/st/rust_scrapling" 2>/dev/null \
              | grep -q "\"vers\":\"$version\""; then
            echo "rust_scrapling $version is already on crates.io — skipping publish."
            echo "crates_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "crates_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.version.outputs.tag_new == 'true'
        # Notes are written to $RUNNER_TEMP, NOT the working tree: a dirty
        # checkout would make `cargo publish --locked` refuse to run.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$version" '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "No CHANGELOG section found for $version — using a generic note." >&2
            echo "Release v$version. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)." > "$notes"
          fi
          {
            echo ""
            echo "---"
            echo "Published on crates.io: https://crates.io/crates/rust_scrapling/$version"
          } >> "$notes"

      - name: Create tag and GitHub release
        if: steps.version.outputs.tag_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Install Rust toolchain
        if: steps.version.outputs.crates_new == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Authenticate with crates.io via OIDC (trusted publishing)
        if: steps.version.outputs.crates_new == 'true'
        id: oidc
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish to crates.io
        if: steps.version.outputs.crates_new == 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          CARGO_REGISTRY_TOKEN="${OIDC_TOKEN:-${SECRET_TOKEN:-}}"
          export CARGO_REGISTRY_TOKEN
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No crates.io credentials (neither OIDC trusted publishing nor CARGO_REGISTRY_TOKEN secret) — skipping publish."
            exit 0
          fi
          cargo publish --locked
